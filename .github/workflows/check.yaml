# keel's gates. `docs/` lives inside this repository, so `make check` needs no arguments.
#
# The check job is docs-bootstrap's reference workflow (templates/workflow-check.yaml) plus one step
# of keel's own, the rename on a copy; the build jobs are keel's.
#
# THE VERSION OF THE DOCUMENTATION CHECKS IS WRITTEN HERE AND NOWHERE ELSE: the ref in the
# `uses: youndie/docs-bootstrap@...` lines below. CI runs the checks at that ref because the runner
# resolves it; the Makefile reads the same line and fetches the same ref for a local `make check`.
# Renovate bumps it, so a release of the checks arrives as one pull request that moves CI and every
# laptop together. Both lines name the same ref, and the Makefile refuses to guess when they do not.

name: check

# **No path filters.** A filter saves seconds and buys red default branches. Two changes that are
# each harmless alone disagree once merged; a generated index diverges from its sources when
# something outside the listed paths moves; and a document at the root of the tree is exactly the
# one nobody remembers to add to the list, so the check that would have caught it never runs.
# Sixty documents are checked in seconds. There is nothing here worth economising on.
on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"          # Monday morning, for the anchors job below
  workflow_dispatch:

jobs:
  # The gate. The action runs `make check` - exactly the target a contributor runs, so that "green
  # here, red there" cannot become the normal state of affairs - and around it the two checks that
  # depend on the event: on a pull request, backlog item numbers against the base branch, BEFORE the
  # gate; on a push to the default branch, `status: draft` as an error (on since B-10). Why each sits
  # where it does, and when the first is only a backstop, is written next to the step in the
  # action's action.yml.
  check:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: youndie/docs-bootstrap@v0.3.5

      # THE RENAME, ON A COPY. `scripts/rename.sh` ends by failing if the template's name is left
      # anywhere outside its allowlist, and that check is only worth something if it runs whenever a
      # line is added here. A new file that spells the name in a form the script's rules do not know
      # turns this red in the pull request that adds it, rather than in the next clone. Seconds: no
      # Gradle, only the rewrite and the grep. The copy carries `.git` because the script reads the
      # tracked files. In a clone that has already been renamed there is nothing left to rewrite, and
      # the step passes.
      #
      # `make gate` afterwards runs on what the clone gets: the skeleton from `skeleton/`, with its one
      # seed item. That is the only place the skeleton is checked, since this repository's own gate
      # reads `docs/`. It runs the way a clone runs it - the Makefile reads the `uses:` line above and
      # fetches that ref - so the copy also proves a clone can reach its checks; the step above set up
      # the Python and PyYAML it needs.
      - run: |
          cp -a . "$RUNNER_TEMP/renamed"
          cd "$RUNNER_TEMP/renamed"
          scripts/rename.sh demo
          make gate

  # THE CODE GATE. Until B-06 there was none, and a pull request that did not compile was green —
  # which stopped being only a reviewer's problem when the loop began merging on green CI.
  build:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # BY NAME RATHER THAN BY COPY. Java, Gradle and the `~/.konan` cache in one step and at one
      # version; the portfolio ran three different versions of `setup-gradle` at once before this
      # action existed. The cache matters here specifically: the Kotlin/Native toolchain is around a
      # gigabyte and is fetched on every cold runner.
      - uses: youndie/sborka/.github/actions/setup-kotlin@main
        with:
          konan-cache: "true"

      # `make build`, not `./gradlew` directly, so the command a contributor runs and the command
      # that gates a pull request are one string in one place — the same reason the job above runs
      # `make check` rather than listing the checks.
      - run: make build GRADLEFLAGS=--no-daemon

      # THE EXIT CODE IS NOT THE EVIDENCE. A suite that ran zero tests exits zero, and on a
      # multiplatform build the suite that silently does not run is the interesting one: `build` was
      # green for two items here while running no tests at all.
      #
      # So the targets are named rather than counted. `find | wc -l` passes when `linuxX64Test`
      # quietly stops being wired and the JVM suite carries the run on its own, which is the exact
      # shape of "a check that passes on one target and is skipped on the other" — the brief's red
      # list. Naming them means the failure says which one went missing.
      - name: report which suites actually ran
        if: always()
        run: |
          set -u
          fail=0
          for target in jvmTest linuxX64Test; do
            files=$(find server/build/test-results/"$target" -name '*.xml' 2>/dev/null | sort)
            if [ -z "$files" ]; then
              echo "::error::no test results for $target - that suite did not run"
              fail=1
              continue
            fi
            total=0
            for f in $files; do
              printf '%s ' "$f"
              grep -o 'tests="[0-9]*" skipped="[0-9]*" failures="[0-9]*" errors="[0-9]*"' "$f" || echo
              n=$(sed -n 's/.*<testsuite[^>]*tests="\([0-9]*\)".*/\1/p' "$f" | head -1)
              total=$((total + ${n:-0}))
            done
            echo "$target: $total tests"
            [ "$total" -gt 0 ] || { echo "::error::$target produced result files but ran zero tests"; fail=1; }
          done
          [ "$fail" = 0 ] || exit 1

      # THE arm64 TEST BINARY, CROSS-LINKED HERE AND RUN SOMEWHERE ELSE.
      #
      # Kotlin/Native has no `linux_arm64` host, so `linuxArm64Test` is never CREATED — it does not
      # appear as skipped, it does not appear at all, and no runner can be told to run it. Linking and
      # running are separable even where the plugin will not do it for you.
      #
      # `linkDebugTestLinuxArm64` and not `build`: with two native targets `stageNativeImage` stages
      # both release binaries under one name and Gradle refuses (youndie/sborka#80). This path does not
      # go through it.
      - run: ./gradlew linkDebugTestLinuxArm64 -Pkeel.linuxArm64=true --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: linuxarm64-test-binary
          path: server/build/bin/linuxArm64/debugTest/test.kexe
          if-no-files-found: error

  # THE SUITE THAT HOST CANNOT RUN. Takes the binary the x86-64 job cross-linked and executes it on a
  # machine of that architecture.
  linux-arm64-suite:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    needs: build
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linuxarm64-test-binary

      - name: run the linuxArm64 suite
        run: |
          set -u
          [ -f test.kexe ] || { echo "::error::no linuxArm64 test binary was produced"; exit 1; }
          chmod +x test.kexe
          # THE EXIT CODE IS THE VERDICT and the count under it is a floor. A suite that ran zero
          # tests exits zero, which is the failure this repository keeps meeting; reading a *pass*
          # out of the text would be the other one, so it is not done here.
          out=$(./test.kexe 2>&1) || fail=1
          echo "$out"
          n=$(echo "$out" | sed -n 's/.*Running \([0-9][0-9]*\) test.*/\1/p' | head -1)
          echo "$((${n:-0})) tests on $(uname -m)"
          [ "${fail:-0}" = 0 ] || { echo "::error::the linuxArm64 suite failed"; exit 1; }
          [ "${n:-0}" -gt 0 ] || { echo "::error::the linuxArm64 binary ran zero tests"; exit 1; }

  # Separate from the gate, and on a schedule rather than on a pull request, because an anchor rots
  # when somebody refactors a **different** repository. A pull request here is the least likely
  # moment for one to break, and running it there trains people to ignore a red build they did not
  # cause. It also does not block: a path quoted *as obsolete* is indistinguishable from a live one
  # by machine, so the report is read by a person - and `make report` never fails (the Makefile says
  # why), so this job is red only when it cannot run at all.
  anchors:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The code lives in this checkout, so its parent is a directory whose one subdirectory is
      # this repository - which is exactly what REPOS (`..` by default) expects.
      - uses: youndie/docs-bootstrap@v0.3.5
        with:
          target: report

      # For a separate documentation repository, put shallow clones of the services next to the
      # step above and point REPOS at them. History is not needed - only the file tree - and a
      # repository that cannot be cloned is a warning rather than a failure, because its anchors are
      # simply unchecked.
      #
      # `secrets.GITHUB_TOKEN` is scoped to the repository running the workflow. That is enough for
      # public services, which is how the block below was tested; a private one needs a token that
      # can read it, and with the default one it will take the warning branch every week without
      # ever saying why.
      #
      #   - run: |
      #       mkdir -p repos && cd repos
      #       for r in service-one service-two; do
      #         git clone --depth 1 --filter=blob:none --no-checkout \
      #           "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository_owner }}/$r.git" \
      #           || echo "::warning::$r is unreachable - its anchors were not checked"
      #       done
      #     env:
      #       GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      #   - uses: youndie/docs-bootstrap@v0.3.5
      #     with:
      #       target: report REPOS=repos
